<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="#f97316">
  <!-- First Paw Print (bottom left) -->
  <g transform="translate(5, 45) scale(0.45) rotate(-15)">
    <!-- Main pad -->
    <path d="M50 90 C30 90, 20 75, 25 55 C30 35, 70 35, 75 55 C80 75, 70 90, 50 90 Z" />
    <path d="M48 40 L52 40 L50 48 Z" fill="#fff" opacity="0" /> <!-- Just a center reference if needed -->
    <!-- Toes -->
    <ellipse cx="25" cy="35" rx="12" ry="16" transform="rotate(-25 25 35)" />
    <ellipse cx="40" cy="18" rx="12" ry="15" transform="rotate(-10 40 18)" />
    <ellipse cx="60" cy="18" rx="12" ry="15" transform="rotate(10 60 18)" />
    <ellipse cx="75" cy="35" rx="12" ry="16" transform="rotate(25 75 35)" />
  </g>

  <!-- Second Paw Print (top right) -->
  <g transform="translate(50, 10) scale(0.45) rotate(15)">
    <!-- Main pad -->
    <path d="M50 90 C30 90, 20 75, 25 55 C30 35, 70 35, 75 55 C80 75, 70 90, 50 90 Z" />
    <!-- Toes -->
    <ellipse cx="25" cy="35" rx="12" ry="16" transform="rotate(-25 25 35)" />
    <ellipse cx="40" cy="18" rx="12" ry="15" transform="rotate(-10 40 18)" />
    <ellipse cx="60" cy="18" rx="12" ry="15" transform="rotate(10 60 18)" />
    <ellipse cx="75" cy="35" rx="12" ry="16" transform="rotate(25 75 35)" />
  </g>
</svg>
